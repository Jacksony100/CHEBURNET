name: Публикация релиза
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Проверка неизменяемого импорта исходного выпуска
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $payloadVersion = [string](Get-Content resources\upstream\provenance.json -Raw | ConvertFrom-Json).version
          scripts\sync-upstream.ps1 -Version $payloadVersion -CheckOnly
      - name: Чистая сборка и полная проверка
        shell: powershell
        run: |
          scripts\build-release.ps1 -BuildDir build-release
          scripts\run-tests.ps1 -BuildDir build-release
          scripts\validate-licenses.ps1
      # Стабильный тег vX.Y.Z подписывается обязательно: отсутствие
      # сертификата, неудачная подпись, отсутствие метки времени или
      # непрошедшая проверка подписи останавливают выпуск. Для тега
      # предварительной версии vX.Y.Z-rc.N подпись остаётся необязательной —
      # это осознанное исключение, описанное в docs/production/RELEASE_SIGNING.md.
      - name: Обязательная подпись Authenticode для стабильного тега
        if: ${{ !contains(github.ref_name, '-rc.') }}
        shell: powershell
        env:
          AUTHENTICODE_PFX_B64: ${{ secrets.AUTHENTICODE_PFX_B64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: scripts\authenticode-sign.ps1 -File build-release\CHEBURNET.exe -Require
      - name: Необязательная подпись Authenticode для предварительного выпуска
        if: ${{ contains(github.ref_name, '-rc.') }}
        shell: powershell
        env:
          AUTHENTICODE_PFX_B64: ${{ secrets.AUTHENTICODE_PFX_B64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
        run: scripts\authenticode-sign.ps1 -File build-release\CHEBURNET.exe
      # Хеши и подписанный манифест считаются ТОЛЬКО после подписи, поэтому
      # опубликованный SHA-256 описывает именно подписанный файл.
      - name: Сборка релиза и подписанных метаданных обновления
        shell: powershell
        env:
          CHEBURNET_SIGNING_KEY_CNG_BLOB_B64: ${{ secrets.CHEBURNET_SIGNING_KEY_CNG_BLOB_B64 }}
        run: scripts\prepare-release.ps1 -Tag '${{ github.ref_name }}' -Repository '${{ github.repository }}' -BuildDir build-release -OutDir dist
      - name: Независимая проверка подписи публикуемого файла
        if: ${{ !contains(github.ref_name, '-rc.') }}
        shell: powershell
        run: scripts\verify-authenticode.ps1 -File dist\CHEBURNET.exe -RequireTimestamp
      - name: Публикация релиза GitHub
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          name: CHEBURNET ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            dist/CHEBURNET.exe
            dist/CHEBURNET.exe.sha256
            dist/cheburnet-payload-*.cbpkg
            dist/cheburnet-payload-*.cbpkg.sha256
            dist/update-manifest.json
            dist/update-manifest.json.sig
            dist/THIRD_PARTY_NOTICES.md
            dist/DEPENDENCIES.md
            dist/LICENSES/*
