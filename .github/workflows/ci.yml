name: Проверка проекта
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Настройка и выпускная сборка (/W4 /WX)
        shell: powershell
        run: scripts\build-release.ps1 -BuildDir build-ci
      - name: Модульные тесты, проверки безопасности и точности
        shell: powershell
        run: scripts\run-tests.ps1 -BuildDir build-ci
      - name: Проверка происхождения и актуальности исходного выпуска
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = [string](Get-Content resources\upstream\provenance.json -Raw | ConvertFrom-Json).version
          scripts\sync-upstream.ps1 -Version $version -CheckOnly
      - name: Проверка лицензий
        shell: powershell
        run: scripts\validate-licenses.ps1
      - name: Пробная упаковка и негативные тесты путей
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\authenticode-sign.ps1 -File build-ci\CHEBURNET.exe
          scripts\package.ps1 -BuildDir build-ci -OutDir artifacts\dist-test -SkipBuild
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\package_safety.ps1 -RepositoryRoot $PWD
      - name: Загрузка неподписанного CI-артефакта
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CHEBURNET-ci
          path: artifacts/dist-test/
