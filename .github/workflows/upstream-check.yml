name: Проверка исходного выпуска
on:
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверка последнего неизменяемого стабильного релиза
        shell: powershell
        run: scripts\sync-upstream.ps1 -CheckOnly
      - name: Политика обновления
        shell: powershell
        run: Write-Host 'Новый исходный релиз требует проверенной ветки и запроса на слияние; этот процесс никогда не объединяет бинарники автоматически.'
