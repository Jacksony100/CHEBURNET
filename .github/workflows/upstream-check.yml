name: Check upstream
on:
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check immutable latest stable release
        shell: powershell
        run: scripts\sync-upstream.ps1 -CheckOnly
      - name: Policy
        shell: powershell
        run: Write-Host 'A new upstream release requires a reviewed branch/PR; this workflow never merges binaries.'
