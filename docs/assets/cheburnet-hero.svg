  <text x="68" y="190" fill="#f5f7fa" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="3">CHEBUR</text><text x="430" y="190" fill="url(#orange)" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="3">NET</text>
