    <g font-family="Consolas, Menlo, monospace" font-size="14"><text x="22" y="74" fill="#66717d">$</text><text x="42" y="74" fill="#f5f7fa">cheburnet --status</text><text x="22" y="108" fill="#2ee66b">● ДВИЖОК</text><text x="124" y="108" fill="#c5ccd4">Flowseal 1.10.1</text><text x="22" y="138" fill="#2ee66b">● СТРАТЕГИЯ</text><text x="124" y="138" fill="#c5ccd4">динамическая / general</text><text x="22" y="168" fill="#2ee66b">● ОБНОВЛЕНИЕ</text><text x="154" y="168" fill="#c5ccd4">подпись проверена</text></g>
